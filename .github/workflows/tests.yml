name: Danory v7 tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy tokenizers
      - run: python -m compileall -q danory train.py generate.py scripts build_tokenizer.py
      - run: python scripts/model_info.py
      - run: python scripts/model_forward_test.py
